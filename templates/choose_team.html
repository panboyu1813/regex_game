
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>選擇小隊</title>
</head>
<body>
    <h2>請選擇你的小隊 (0 ~ 9)</h2>
    {% if error %}
    <p style="color:red;">{{ error }}</p>
    {% endif %}
    <form method="post">
        <select name="team" required>
            <option value="">--請選擇--</option>
            {% for i in range(10) %}
                <option value="{{ i }}">{{ i }}</option>
            {% endfor %}
        </select>
        <button type="submit">開始遊戲</button>
    </form>
</body>
</html>
